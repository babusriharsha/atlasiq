name: AtlasIQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: atlasiq_test
          POSTGRES_USER: atlasiq_user
          POSTGRES_PASSWORD: atlasiq_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U atlasiq_user -d atlasiq_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://atlasiq_user:atlasiq_test_password@localhost:5432/atlasiq_test
      TEST_DATABASE_URL: postgresql+psycopg://atlasiq_user:atlasiq_test_password@localhost:5432/atlasiq_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements-docker.txt

      - name: Run database migrations
        run: |
          alembic upgrade head

      - name: Run tests with coverage
        run: |
          pytest --cov=app --cov-report=term-missing
